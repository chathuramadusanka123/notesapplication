# Local stack: app + MongoDB + monitoring.  Run from the Thinkerboard folder:
#   docker compose up -d --build
#   App:          http://localhost:5001
#   Prometheus:   http://localhost:9090   (Status -> Targets, Alerts)
#   Alertmanager: http://localhost:9093
#   Grafana:      http://localhost:3000   (admin / admin)
# Uses a local MongoDB, so your Atlas data is never touched while developing.
# To test the rate limiter, put your Upstash values in a .env file next to this one.

services:
  app:
    build:
      context: .
      args:
        GIT_SHA: local
    ports: ["5001:5001"]
    environment:
      MONGO_URI: mongodb://mongo:27017/thinkboard
      LOG_LEVEL: info
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    volumes: ["./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes: ["./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mongo-data:
